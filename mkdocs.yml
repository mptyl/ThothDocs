site_name: ThothAI Backend Documentation
site_url: https://sitename.example
dev_addr: 127.0.0.1:8199
theme:
  name: material
  favicon: assets/favicon.ico
  icon:
    logo: simple/surveymonkey
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Dark mode
      primary: green
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Light mode
      primary: blue
      accent: deep orange
  features:
    - content.code.copy
nav:
  - Home: index.md
  - Docker Install:
      - Sources Cloning: 1-docker_install/1.1-sources_cloning.md
      - Docker Assisted: 1-docker_install/1.2-docker_assisted.md
  - Local Install:
      - Sources Cloning: 2-local_install/2.1-sources_cloning.md
      - Local: 2-local_install/2.2-local.md
  - Quick Start:
      - Quick Start Frontend: 3-quickstart/3.1-quickstart.md
  - User Manual:
      - Setup:
          - Setup Process: 4-user_manual/4.1-setup/4.1.1-setup_process.md
          - Authentication:
             - Groups: 4-user_manual/4.1-setup/4.1.4-authentication/4.1.4.1-groups.md
             - Users: 4-user_manual/4.1-setup/4.1.4-authentication/4.1.4.2-users.md
             - Group Profiles: 4-user_manual/4.1-setup/4.1.4-authentication/4.1.4.3-group_profiles.md
          - AI Models And Agents:
             - Basic AI Models: 4-user_manual/4.1-setup/4.1.3-AI_models_and_agents/4.1.3.1-basic_ai_models.md
             - AI Models: 4-user_manual/4.1-setup/4.1.3-AI_models_and_agents/4.1.3.2-ai_models.md
             - Agents: 4-user_manual/4.1-setup/4.1.3-AI_models_and_agents/4.1.3.3-agents.md

          - Vector Database: 4-user_manual/4.1-setup/4.1.5-vector_db.md
          - SQL Database:
              - SQL DBs: 4-user_manual/4.1-setup/4.1.6-SQL_database/4.1.6.1-sql_dbs.md
              - SQL Tables: 4-user_manual/4.1-setup/4.1.6-SQL_database/4.1.6.2-sql_tables.md
              - SQL Columns: 4-user_manual/4.1-setup/4.1.6-SQL_database/4.1.6.3-sql_columns.md
              - Relationships: 4-user_manual/4.1-setup/4.1.6-SQL_database/4.1.6.4-relationships.md
          - Workspaces: 4-user_manual/4.1-setup/4.1.7-workspaces.md
          - Settings: 4-user_manual/4.1-setup/4.1.8-settings.md
      - Preprocessing:
          - Why The Preprocessing: 4-user_manual/4.2-preprocessing/4.2.1-why_the_preprocessing.md
          - Evidence: 4-user_manual/4.2-preprocessing/4.2.2-evidence.md
          - Gold SQL: 4-user_manual/4.2-preprocessing/4.2.3-gold_sql.md
          - Update Columns Description: 4-user_manual/4.2-preprocessing/4.2.4-update_columns_description.md
          - Run Preprocessing: 4-user_manual/4.2-preprocessing/4.2.5-run_preprocessing.md
      - Logging:
          - Logfire: 4-user_manual/4.3-logging/4.3.1-logfire.md
          - Log Management: 4-user_manual/4.3-logging/4.3.2-log_management.md
  - Text to SQL: text-to-SQL.md

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/youtube
      link: https://youtube.com/@tylconsulting
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/marcopancotti
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/custom.js

copyright: Copyright &copy; 2025 Tyl Consulting di Pancotti Marco


